<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Swift Equipment Ltd.">
<meta property="og:title" content="Swift Equipment Ltd.">

</head>

<body>
  <main class="stage">
    <img class="mark" src="assets/img/logo-white.svg" alt="Swift Equipment Ltd."
         width="919" height="231">

    <span class="divider" aria-hidden="true"></span>

    <h1>Coming soon</h1>
    <p class="lede">Our website is on the way. Send us a message and we'll get back to you.</p>

    <form class="enquiry" action="https://formsubmit.co/hussein@swiftequipment.ca" method="POST">
      <!-- FormSubmit settings. _honey is a bot trap: real people never see it. -->
      <input type="hidden" name="_subject" value="Enquiry from swiftequipment.ca">
      <input type="hidden" name="_next" value="https://swiftequipment.ca/thanks.html">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

      <p class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </p>

      <p class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </p>

      <p class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>
      </p>

      <button type="submit">Send</button>
    </form>

    <address>
      482 South Service Road East, Unit 202<br>
      Oakville, Ontario&nbsp; L6J 2X6
    </address>
  </main>

  <footer>&copy; Swift Equipment Ltd.</footer>

  }
}
